<section
  class="store-page"
  aria-labelledby="store-title"
>
  <div class="container">
    @if (selected(); as product) {
      <a
        class="back-link"
        routerLink="/store"
        [queryParams]="{ kategorie: product.category }"
      >
        ←
        <app-localized-text [text]="label('back')" />
      </a>
      <article class="product-detail">
        <div class="detail-photo">
          <img
            [src]="'images/' + product.image"
            [alt]="product.title[state.language()] + ' · ' + copy().demo"
            width="800"
            height="1000"
          />
          <img
            class="product-brand"
            src="images/mainlogo.png"
            alt="Medeina by Çağla Mutlu"
            width="1500"
            height="1660"
          />
        </div>
        <div class="detail-copy">
          <p class="product-format"><app-localized-text [text]="product.format" /></p>
          <h1 id="store-title"><app-localized-text [text]="product.title" /></h1>
          <p class="lead"><app-localized-text [text]="product.description" /></p>
          <p class="detail-description"><app-localized-text [text]="product.detail" /></p>
          <div class="product-facts">
            <h2><app-localized-text [text]="label('format')" /></h2>
            <p><app-localized-text [text]="product.format" /></p>
            <p class="detail-price"><app-localized-text [text]="prices(product)" /></p>
            <p class="price-caption"><app-localized-text [text]="label('price')" /></p>
          </div>
          <a
            class="button"
            [routerLink]="['/store', product.id, 'checkout']"
          >
            <app-localized-text [text]="label('checkout')" />
            <span aria-hidden="true">→</span>
          </a>
          <p class="payment-note"><app-localized-text [text]="label('checkoutInfo')" /></p>
          <a
            class="text-link"
            [href]="inquiryHref(product)"
          >
            <app-localized-text [text]="label('request')" />
            <span aria-hidden="true">↗</span>
          </a>
          <p class="demo-note"><app-localized-text [text]="label('demo')" /></p>
        </div>
      </article>
    } @else {
      <div class="store-intro">
        <div>
          <h1 id="store-title"><app-localized-text [text]="label('title')" /></h1>
          <p class="lead"><app-localized-text [text]="label('intro')" /></p>
          <a
            class="text-link"
            href="#kollektion"
            (click)="collection.scrollIntoView({ behavior: 'auto' }); $event.preventDefault()"
          >
            <app-localized-text [text]="label('collection')" />
            <span aria-hidden="true">↓</span>
          </a>
        </div>
        <div class="intro-photo">
          <img
            src="images/retreats.png"
            alt=""
            width="900"
            height="900"
            fetchpriority="high"
          />
        </div>
      </div>
      <p class="preview-note"><app-localized-text [text]="label('preview')" /></p>
      <section
        class="collection"
        aria-labelledby="collection-title"
      >
        <div
          #collection
          id="kollektion"
          class="collection-heading"
        >
          <h2 id="collection-title"><app-localized-text [text]="label('collection')" /></h2>
          <span aria-live="polite">
            {{ products().length }}
            <app-localized-text [text]="label('count')" />
          </span>
        </div>
        <nav
          class="store-filters"
          [attr.aria-label]="copy().filters"
        >
          @for (category of categories; track category.id) {
            <a
              routerLink="/store"
              fragment="kollektion"
              [queryParams]="category.id === 'alle' ? {} : { kategorie: category.id }"
              [attr.aria-current]="filter() === category.id ? 'true' : null"
            >
              <app-localized-text [text]="category.title" />
            </a>
          }
        </nav>
        <div class="product-grid">
          @for (product of products(); track product.id) {
            <article class="product-card">
              <a
                class="product-photo"
                [routerLink]="['/store', product.id]"
                [attr.aria-label]="product.title[state.language()]"
              >
                <img
                  [src]="'images/' + product.image"
                  [alt]="product.title[state.language()] + ' · ' + copy().demo"
                  width="600"
                  height="750"
                  loading="lazy"
                />
                <img
                  class="product-brand"
                  src="images/mainlogo.png"
                  alt=""
                  width="1500"
                  height="1660"
                  loading="lazy"
                />
                <span
                  class="photo-action"
                  aria-hidden="true"
                >
                  ↗
                </span>
              </a>
              <div class="product-info">
                <p class="product-format"><app-localized-text [text]="product.format" /></p>
                <h3>
                  <a [routerLink]="['/store', product.id]">
                    <app-localized-text [text]="product.title" />
                  </a>
                </h3>
                <p class="product-description">
                  <app-localized-text [text]="product.description" />
                </p>
                <div class="product-bottom">
                  <div class="price-block">
                    <span><app-localized-text [text]="prices(product)" /></span>
                    <small><app-localized-text [text]="label('price')" /></small>
                  </div>
                  <a
                    class="text-link"
                    [routerLink]="['/store', product.id]"
                  >
                    <app-localized-text [text]="label('details')" />
                    <span aria-hidden="true">→</span>
                  </a>
                </div>
              </div>
            </article>
          }
        </div>
      </section>
    }
    <aside
      class="store-contact"
      aria-labelledby="store-contact-title"
    >
      <div>
        <h2 id="store-contact-title"><app-localized-text [text]="label('note')" /></h2>
        <p><app-localized-text [text]="label('noteText')" /></p>
      </div>
      <a
        class="button button-outline"
        href="mailto:medeinaa@hotmail.com"
      >
        <app-localized-text [text]="label('contact')" />
        <span aria-hidden="true">↗</span>
      </a>
    </aside>
  </div>
</section>
