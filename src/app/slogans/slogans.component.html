<section
  id="slogans"
  class="slogans container"
  aria-labelledby="slogans-title"
  appScrollReveal
  data-reveal="right"
>
  <div class="section-heading">
    <p class="eyebrow muted">Medeina</p>
    <h2 id="slogans-title">{{ state.copy.slogansTitle }}</h2>
  </div>
  <div class="slogan-grid">
    <figure class="slogan-card">
      <img
        src="images/slogan1.png"
        alt="The key to transformation is in you"
        lang="en"
        width="2636"
        height="2948"
        loading="lazy"
      />
      <figcaption>{{ state.copy.sloganTransformation }}</figcaption>
    </figure>
    <figure class="slogan-card">
      <img
        src="images/slogan2.png"
        alt="Heal. Grow. Bloom."
        lang="en"
        width="2637"
        height="2948"
        loading="lazy"
      />
      <figcaption>{{ state.copy.sloganBloom }}</figcaption>
    </figure>
  </div>
</section>
