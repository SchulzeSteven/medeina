<header
  class="site-header"
  (keydown.escape)="state.navigate(); menuToggle.focus(); $event.stopPropagation()"
>
  <a
    href="./"
    (click)="state.navigateTo('start', $event)"
    class="brand"
    [attr.aria-label]="'Medeina · Çağla Mutlu – ' + state.copy.home"
  >
    <img
      class="brand-wordmark"
      src="images/name-header.png"
      alt="Medeina"
      width="2171"
      height="724"
    />
  </a>
  <button
    #menuToggle
    class="menu-toggle"
    type="button"
    (click)="state.menuOpen.set(!state.menuOpen())"
    [attr.aria-expanded]="state.menuOpen()"
    aria-controls="navigation"
    [attr.aria-label]="state.copy.menu"
  >
    <span
      class="menu-icon"
      aria-hidden="true"
    ></span>
  </button>
  <nav
    id="navigation"
    [class.open]="state.menuOpen()"
    [attr.aria-label]="state.copy.navigation"
  >
    <a
      href="./"
      (click)="state.navigateTo('start', $event)"
    >
      {{ state.copy.home }}
    </a>
    <a
      routerLink="/ueber-mich"
      routerLinkActive="active"
      (click)="state.navigate()"
    >
      {{ state.copy.about }}
    </a>
    <a
      routerLink="/angebote"
      routerLinkActive="active"
      (click)="state.navigate()"
    >
      {{ state.copy.offersLabel }}
    </a>
    <a
      routerLink="/store"
      routerLinkActive="active"
      (click)="state.navigate()"
    >
      {{ state.copy.storeLabel }}
    </a>
    <button
      class="nav-link"
      (click)="state.book('contact')"
    >
      {{ state.copy.contact }}
    </button>
    <button
      class="button mobile-book"
      (click)="state.book()"
    >
      {{ state.copy.book }}
    </button>
  </nav>
  <button
    class="button header-book"
    (click)="state.book()"
  >
    {{ state.copy.book }}
  </button>
  <div
    class="language-switch"
    role="group"
    [attr.aria-label]="state.copy.language"
  >
    <button
      type="button"
      lang="de"
      aria-label="Deutsch"
      [attr.aria-pressed]="state.language() === 'de'"
      (click)="state.setLanguage('de')"
    >
      DE
    </button>
    <span aria-hidden="true">/</span>
    <button
      type="button"
      lang="tr"
      aria-label="Türkçe"
      [attr.aria-pressed]="state.language() === 'tr'"
      (click)="state.setLanguage('tr')"
    >
      TR
    </button>
    <span aria-hidden="true">/</span>
    <button
      type="button"
      lang="en"
      aria-label="English"
      [attr.aria-pressed]="state.language() === 'en'"
      (click)="state.setLanguage('en')"
    >
      EN
    </button>
  </div>
</header>
